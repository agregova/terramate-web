
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Seed Mate – Karta semienok</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ef;
      margin: 0;
      padding: 24px 16px;
      color: #30352b;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      overflow-wrap: anywhere;
    }

    .variety {
      color: #777;
      font-size: 16px;
      margin-bottom: 24px;
      overflow-wrap: anywhere;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #eeece6;
    }

    .row[hidden] {
      display: none;
    }

    .label {
      font-weight: 600;
    }

    .value {
      text-align: right;
      overflow-wrap: anywhere;
    }

    button {
      margin-top: 28px;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #566c4a;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #455a3b;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="plant"></h1>
    <div class="variety" id="variety"></div>

    <div class="row" id="yearRow" hidden>
      <span class="label">🌾 Rok zberu</span>
      <span class="value" id="year"></span>
    </div>

    <div class="row" id="sourceRow" hidden>
      <span class="label">🌱 Pôvod</span>
      <span class="value" id="source"></span>
    </div>

    <div class="row" id="directRow" hidden>
      <span class="label">🌿 Priamy výsev</span>
      <span class="value" id="direct"></span>
    </div>

    <div class="row" id="startingRow" hidden>
      <span class="label">🪴 Predpestovanie</span>
      <span class="value" id="starting"></span>
    </div>

    <button id="addButton">
      Pridať do Seed Mate
    </button>

    <div class="footer">
      Seed Mate · TerraMate
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    function getValue(key) {
      return (params.get(key) ?? '').trim();
    }

    function showField(rowId, valueId, value) {
      const row = document.getElementById(rowId);
      const element = document.getElementById(valueId);

      if (value) {
        element.textContent = value;
        row.hidden = false;
      }
    }
    
    function formatSowing(value, months) {
      if (value === '1') {
        return months
          ? months.split(',').map(m => m.trim()).join(', ')
          : 'Áno';
      }
    
      if (value === '0') {
        return 'Nie';
      }
    
      return '';
    }

    const plant = getValue('p');
    const variety = getValue('n');

    document.getElementById('plant').textContent = plant;
    document.getElementById('variety').textContent = variety;

    showField('yearRow', 'year', getValue('y'));
    showField('sourceRow', 'source', getValue('src'));

    showField(
      'directRow',
      'direct',
      formatSowing(getValue('ds'), getValue('dm'))
    );

    showField(
      'startingRow',
      'starting',
      formatSowing(getValue('ss'), getValue('sm'))
    );

    document.getElementById('addButton').onclick = () => {
      window.location.href =
        'seedmate://import' + window.location.search;
    };
  </script>

</body>
</html>
